name: Full revision qualification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Source SHA matching the selected workflow ref
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  qualification:
    name: Qualify selected revision
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ inputs.source_sha }}
